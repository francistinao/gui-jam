[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
image-webp = "=0.2.4"
resvg = { version = "=0.49.0", default-features = false }
blake3 = "=1.8.7"
dunce = "=1.0.5"
clap = { version = "=4.6.7", features = ["derive"] }
nix = { version = "=0.31.3", features = ["signal", "process"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs", "net", "sync", "signal"] }
tokio-util = "=0.7.20"
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
typify = "=0.8.0"
schemars08 = { package = "schemars", version = "=0.8.22" }
syn = { version = "=3.0.10", default-features = false, features = ["full", "parsing"] }
prettyplease = "=0.3.0"
regress = "=0.12.0"
which = "=8.0.6"
async-trait = "=0.1.92"
base64 = "=0.22.1"
axum = { version = "=0.8.9", features = ["ws"] }
getrandom = "=0.4.3"
similar = "=3.2.1"
ureq = "=3.5.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
url = "=2.5.8"
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_diagnostics = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
