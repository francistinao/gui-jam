name: npm-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
          registry-url: https://registry.npmjs.org
      - name: Check the NPM_TOKEN account and the guijam organization
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! account="$(npm whoami 2>&1)"; then
            echo "::error::NPM_TOKEN does not authenticate: $account"
            exit 1
          fi
          echo "NPM_TOKEN belongs to npm user: $account"
          if ! members="$(npm org ls guijam 2>&1)"; then
            echo "::error::Could not list the guijam organization. It may not exist, $account may not be a member, or the token may lack organization read access: $members"
            exit 1
          fi
          echo "guijam organization members:"
          echo "$members"
          if ! grep -q "^$account" <<< "$members"; then
            echo "::error::$account is not a member of the guijam organization."
            exit 1
          fi
          echo "Ready: $account can publish into @guijam."
