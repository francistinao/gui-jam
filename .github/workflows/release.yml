name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  binaries:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned toolchain and the ${{ matrix.target }} target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p gjd-daemon --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gjd-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/gjd
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [lint, test, binaries]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PLATFORMS: darwin-arm64 darwin-x64 linux-x64 linux-arm64
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the version and dist-tag from the release
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z or vX.Y.Z-<pre>."
            exit 1
          fi
          if [[ $version == *-* ]]; then suffixed=true; else suffixed=false; fi
          if [[ $suffixed != "$PRERELEASE" ]]; then
            echo "::error::Tag '$TAG' and the release's pre-release flag ($PRERELEASE) disagree."
            exit 1
          fi
          if [[ $PRERELEASE == true ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.21.2 (trusted publishing needs 11.5.1+)
        run: npm install -g npm@11.21.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: gjd-*
          path: ${{ runner.temp }}/gjd

      - name: Build the gjd platform packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPO_URL: git+${{ github.server_url }}/${{ github.repository }}.git
        run: |
          for platform in $PLATFORMS; do
            node scripts/platform-package.mjs "$platform" "$RUNNER_TEMP/gjd/gjd-$platform/gjd" \
              "$VERSION" "$RUNNER_TEMP/platforms"
          done

      - name: Prepare guijam's published package.json
        working-directory: packages/guijam
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REPO_URL: git+${{ github.server_url }}/${{ github.repository }}.git
        run: |
          npm pkg set "version=$VERSION" repository.type=git "repository.url=$REPO_URL"
          npm pkg delete devDependencies scripts
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            manifest.optionalDependencies = Object.fromEntries(
              process.env.PLATFORMS.split(" ").map((platform) => [`@guijam/gjd-${platform}`, process.env.VERSION]),
            );
            fs.writeFileSync("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Point the npm README at this version's files
        run: node scripts/npm-readme.mjs

      - name: Pack guijam
        working-directory: packages/guijam
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Smoke-test the tarball with the linux-x64 gjd
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GJD_BINARY: ${{ runner.temp }}/platforms/gjd-linux-x64/bin/gjd
        run: scripts/smoke-package.sh "$RUNNER_TEMP/guijam-$VERSION.tgz"

      - name: Publish the gjd platform packages, then guijam
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            if [[ -n "$(npm view "$1@$VERSION" version 2> /dev/null || true)" ]]; then
              echo "$1@$VERSION is already on npm; skipping it."
              return
            fi
            npm publish "$2" --access public --tag "$DIST_TAG"
          }
          for platform in $PLATFORMS; do
            publish "@guijam/gjd-$platform" "$RUNNER_TEMP/platforms/gjd-$platform"
          done
          tar -xzf "$RUNNER_TEMP/guijam-$VERSION.tgz" -C "$RUNNER_TEMP"
          publish guijam "$RUNNER_TEMP/package"
